<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MILO — Cardboard VR</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; color: #fff; font-family: Inter, system-ui, sans-serif; }
body { touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.overlay { position: fixed; z-index: 2; top: 16px; left: 16px; max-width: min(430px, calc(100vw - 32px)); padding: 15px 17px; border: 1px solid rgba(255,255,255,.18); border-radius: 14px; background: rgba(15,15,15,.82); backdrop-filter: blur(12px); }
h1 { margin: 0 0 6px; font: 500 1.3rem/1.1 Georgia, serif; letter-spacing: .14em; }
p { margin: 0; color: #d0d0d0; font-size: .88rem; line-height: 1.45; }
.hint { margin-top: 6px; color: #aaa; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
button, .back { border: 1px solid rgba(255,255,255,.5); border-radius: 999px; padding: 9px 13px; color: #fff; background: rgba(255,255,255,.1); font: inherit; font-size: .78rem; cursor: pointer; text-decoration: none; }
button:hover, .back:hover { background: rgba(255,255,255,.22); }
button:disabled { cursor: default; opacity: .55; }
#status { margin-top: 10px; color: #fff; }
.back { display: inline-block; margin-top: 10px; border-color: transparent; padding-left: 0; padding-right: 0; opacity: .8; }
.divider { position: fixed; z-index: 1; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(255,255,255,.22); pointer-events: none; }
@media (orientation: portrait) {
  .hint::after { content: ' Rotate your phone sideways for the best view.'; }
}
</style>
</head>
<body>
<div class="divider" aria-hidden="true"></div>
<div class="overlay">
  <h1>MILO — CARDBOARD VR</h1>
  <p>Turn your phone sideways, tap Enable motion controls, then place it in a Cardboard viewer.</p>
  <p class="hint">No WebXR headset or app is required.</p>
  <div class="controls">
    <button id="motionButton" type="button">Enable motion controls</button>
    <button id="recenterButton" type="button">Recenter</button>
  </div>
  <p id="status" role="status" aria-live="polite">Loading the sculpture…</p>
  <a class="back" href="index.html">← Back to the AR page</a>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const status = document.querySelector('#status');
const motionButton = document.querySelector('#motionButton');
const recenterButton = document.querySelector('#recenterButton');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0f0f);
const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 100);
camera.position.set(0, 1.6, 0);
camera.lookAt(0, 0.9, -2.4);
const stereo = new THREE.StereoCamera();
stereo.eyeSep = 0.064;
const renderer = new THREE.WebGLRenderer({antialias: true, alpha: false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x242424, 2.2));
const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
keyLight.position.set(2, 4, 3);
scene.add(keyLight);
scene.add(new THREE.GridHelper(20, 20, 0x444444, 0x222222));

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, -2.4);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 0.4;
controls.maxDistance = 8;
controls.update();

let motionEnabled = false;
let hasOrientation = false;
let orientationListenerAdded = false;
const rawQuaternion = new THREE.Quaternion();
const recenterQuaternion = new THREE.Quaternion();
const orientationEuler = new THREE.Euler();
const zee = new THREE.Vector3(0, 0, 1);
const q0 = new THREE.Quaternion();
const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

function screenOrientationRadians() {
  const angle = screen.orientation?.angle ?? window.orientation ?? 0;
  return Number(angle) * Math.PI / 180;
}

function setDeviceQuaternion(alpha, beta, gamma) {
  orientationEuler.set(beta, alpha, -gamma, 'YXZ');
  rawQuaternion.setFromEuler(orientationEuler);
  rawQuaternion.multiply(q1);
  rawQuaternion.multiply(q0.setFromAxisAngle(zee, -screenOrientationRadians()));
  if (!hasOrientation) {
    recenterQuaternion.copy(rawQuaternion).invert();
    hasOrientation = true;
  }
  camera.quaternion.copy(recenterQuaternion).multiply(rawQuaternion);
}

function onDeviceOrientation(event) {
  if (event.alpha == null || event.beta == null || event.gamma == null) return;
  setDeviceQuaternion(
    THREE.MathUtils.degToRad(event.alpha),
    THREE.MathUtils.degToRad(event.beta),
    THREE.MathUtils.degToRad(event.gamma)
  );
}

async function enableMotionControls() {
  try {
    if (typeof DeviceOrientationEvent === 'undefined') {
      throw new Error('This phone does not expose motion sensors.');
    }
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== 'granted') throw new Error('Motion permission was not granted.');
    }
    if (!orientationListenerAdded) {
      window.addEventListener('deviceorientation', onDeviceOrientation, true);
      orientationListenerAdded = true;
    }
    motionEnabled = true;
    controls.enabled = false;
    motionButton.disabled = true;
    motionButton.textContent = 'Motion controls enabled';
    status.textContent = 'Motion controls enabled. Insert your phone into Cardboard.';
  } catch (error) {
    status.textContent = `${error.message} You can still look around by dragging on the screen.`;
  }
}

motionButton.addEventListener('click', enableMotionControls);
recenterButton.addEventListener('click', () => {
  if (hasOrientation) {
    recenterQuaternion.copy(rawQuaternion).invert();
    status.textContent = 'View recentered.';
  } else {
    controls.reset();
    status.textContent = 'Drag to look around, then enable motion controls when ready.';
  }
});

const loader = new GLTFLoader();
loader.load(
  'MILO.glb',
  (gltf) => {
    const model = gltf.scene;
    const initialBox = new THREE.Box3().setFromObject(model);
    const initialSize = initialBox.getSize(new THREE.Vector3());
    const scale = 1.5 / Math.max(initialSize.x, initialSize.y, initialSize.z);
    model.scale.setScalar(scale);
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.set(-center.x, -box.min.y, -center.z - 2.4);
    scene.add(model);
    status.textContent = 'Ready. Enable motion controls or drag to look around.';
  },
  undefined,
  () => {
    status.textContent = 'The Cardboard model could not be loaded.';
  }
);

function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = (width / 2) / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height, false);
}

function render() {
  if (!motionEnabled) controls.update();
  stereo.update(camera);
  const width = window.innerWidth;
  const height = window.innerHeight;
  const leftWidth = Math.floor(width / 2);
  const rightWidth = width - leftWidth;
  renderer.clear();
  renderer.setScissorTest(true);
  renderer.setViewport(0, 0, leftWidth, height);
  renderer.setScissor(0, 0, leftWidth, height);
  renderer.render(scene, stereo.cameraL);
  renderer.setViewport(leftWidth, 0, rightWidth, height);
  renderer.setScissor(leftWidth, 0, rightWidth, height);
  renderer.render(scene, stereo.cameraR);
  renderer.setScissorTest(false);
  requestAnimationFrame(render);
}

window.addEventListener('resize', resize);
resize();
render();
</script>
</body>
</html>
