<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MILO — VR</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #0f0f0f; color: white; font-family: Inter, system-ui, sans-serif; }
body { overflow: hidden; }
canvas { display: block; }
.overlay { position: fixed; z-index: 2; top: 18px; left: 18px; max-width: min(420px, calc(100vw - 36px)); padding: 16px 18px; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; background: rgba(15,15,15,.78); backdrop-filter: blur(12px); }
h1 { margin: 0 0 6px; font: 500 1.35rem/1.1 Georgia, serif; letter-spacing: .16em; }
p { margin: 0; color: #c8c8c8; font-size: .9rem; line-height: 1.5; }
.back { display: inline-block; margin-top: 12px; color: #fff; font-size: .8rem; text-decoration: none; opacity: .78; }
.back:hover { opacity: 1; }
#status { margin-top: 8px; color: #fff; }
</style>
</head>

<body>
<div class="overlay">
<h1>MILO — VR</h1>
<p>Put on your WebXR-compatible headset, then use the VR button to enter the sculpture.</p>
<p id="status" role="status">Loading the sculpture…</p>
<a class="back" href="index.html">← Back to the AR page</a>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {VRButton} from 'three/addons/webxr/VRButton.js';

const status = document.querySelector('#status');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0f0f);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0, 1.6, 3.2);

const renderer = new THREE.WebGLRenderer({antialias: true, alpha: false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

scene.add(new THREE.HemisphereLight(0xffffff, 0x242424, 2.2));
const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
keyLight.position.set(2, 4, 3);
scene.add(keyLight);
scene.add(new THREE.GridHelper(20, 20, 0x444444, 0x222222));

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, -2.4);
controls.enableDamping = true;
controls.update();

const loader = new GLTFLoader();
loader.load(
  'MILO.glb',
  (gltf) => {
    const model = gltf.scene;
    const initialBox = new THREE.Box3().setFromObject(model);
    const initialSize = initialBox.getSize(new THREE.Vector3());
    const scale = 1.5 / Math.max(initialSize.x, initialSize.y, initialSize.z);
    model.scale.setScalar(scale);

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.set(-center.x, -box.min.y, -center.z - 2.4);
    scene.add(model);
    status.textContent = 'Ready. Use the VR button to enter.';
  },
  undefined,
  () => {
    status.textContent = 'The VR model could not be loaded.';
  }
);

if (!navigator.xr) {
  status.textContent = 'WebXR VR is not available in this browser. You can still inspect the 3D view.';
} else {
  navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
    if (!supported) status.textContent = 'VR is not supported on this device; the 3D view is still available.';
  });
}

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
